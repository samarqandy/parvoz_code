<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070e20" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parvoz Davomat">

<title>Parvoz Davomat</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<script>
// Temani sahifa chizilishidan oldin qo'llaymiz
(function () {
  var t;
  try { t = localStorage.getItem('parvoz-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">

<script>
// Telefonda konsolni ochib bo'lmaydi — xatoni ekranning o'zida ko'rsatamiz,
// shunda foydalanuvchi uni surat qilib yubora oladi.
(function () {
  var done = false, pending = null;

  function paint(what, detail) {
    var box = document.getElementById('bootErr');
    if (!box) { pending = [what, detail]; return; }     // DOM hali tayyor emas
    done = true;
    var boot = document.getElementById('boot');
    if (boot) boot.classList.add('hidden');
    box.classList.remove('hidden');
    document.getElementById('bootErrWhat').textContent = what;
    document.getElementById('bootErrDetail').textContent = detail || '';
  }
  function fail(what, detail) { if (!done) paint(what, detail); }

  document.addEventListener('DOMContentLoaded', function () {
    if (pending && !done) paint(pending[0], pending[1]);
  });

  window.addEventListener('error', function (e) {
    var el = e.target;
    // Shrift yoki rasm yuklanmasa panel baribir ishlaydi — faqat skriptlar muhim
    if (el && el.tagName === 'SCRIPT') {
      fail('Fayl yuklanmadi / Файл не загрузился', String(el.src || '').split('/').pop());
    } else if (!el || el === window || !el.tagName) {
      fail(e.message || 'Xatolik / Ошибка',
           String(e.filename || '').split('/').pop() + (e.lineno ? ':' + e.lineno : ''));
    }
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    var m = (e.reason && e.reason.message) || e.reason;
    fail("So'rov bajarilmadi / Запрос не выполнен", String(m || ''));
  });

  // 15 soniyada ochilmasa ham xabar beramiz
  var watch = setTimeout(function () {
    var boot = document.getElementById('boot');
    if (boot && !boot.classList.contains('hidden')) {
      fail('Juda uzoq yuklanmoqda / Долго загружается', 'timeout 15s');
    }
  }, 15000);

  window.__bootOk = function () { done = true; clearTimeout(watch); };
})();
</script>
</head>
<body>

<!-- Yuklanish ekrani -->
<div class="auth" id="boot">
  <div style="text-align:center">
    <div style="width:64px;aspect-ratio:447/559;margin:0 auto 14px;background:var(--logo-url) center/contain no-repeat"></div>
    <span class="spin" style="color:var(--gold)"></span>
  </div>
</div>

<!-- Yuklanish xatosi -->
<div class="auth hidden" id="bootErr">
  <div class="auth-card">
    <div class="boot-err-ico">&#9888;</div>
    <h1>Panel ochilmadi</h1>
    <p class="sub">Панель не открылась</p>
    <p class="boot-err-what" id="bootErrWhat"></p>
    <p class="boot-err-detail" id="bootErrDetail"></p>
    <button class="btn btn-primary btn-block" onclick="location.reload(true)" type="button">Qayta urinish / Повторить</button>
    <p class="auth-foot"><a href="index.html">&#8592; Saytga qaytish</a></p>
  </div>
</div>

<!-- Kirish -->
<div class="auth hidden" id="auth">
  <div class="auth-card">
    <div class="logo"></div>
    <h1 id="authTitle" data-t="authTitle">Davomat tizimi</h1>
    <p class="sub" id="authSub" data-t="authSub">Parvoz O'quv Markazi · ichki tizim</p>
    <form id="authForm">
      <label class="field hidden"><span data-t="fName">Ism-familiya</span>
        <input class="inp" id="authName" autocomplete="name"></label>
      <label class="field"><span data-t="fEmail">Email</span>
        <input class="inp" id="authEmail" type="email" required autocomplete="username"></label>
      <label class="field"><span data-t="fPass">Parol</span>
        <input class="inp" id="authPass" type="password" required minlength="8" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-block" id="authSubmit" type="submit" data-t="signIn">Kirish</button>
      <div class="err" id="authErr"></div>
    </form>
    <div class="chips auth-langs">
      <button class="chip" data-lang-pick="uz" type="button">O'zbekcha</button>
      <button class="chip" data-lang-pick="ru" type="button">Русский</button>
    </div>
    <p class="auth-foot"><a href="index.html">← <span data-t="backSite">Saytga qaytish</span></a></p>
  </div>
</div>

<!-- Ilova -->
<div class="app hidden" id="app">

  <aside class="sidebar">
    <div class="side-brand">
      <div class="logo"></div>
      <div><b>Parvoz</b><small data-t="authTitle">Davomat tizimi</small></div>
    </div>
    <nav class="side-nav" id="sideNav" aria-label="Asosiy menyu"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="logo"></div>
      <h1 id="pageTitle" data-t="navToday">Davomat</h1>

      <div class="tb-actions">
        <!-- Til -->
        <div class="menu-wrap">
          <button class="tb-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="tb-ico" id="langIco"></span><span class="tb-code" id="langCode">UZ</span>
          </button>
          <div class="menu" id="langMenu" role="menu" hidden></div>
        </div>

        <!-- Yorug' / qorong'i -->
        <button class="tb-btn tb-icon" data-theme-toggle type="button"></button>

        <!-- Hisob -->
        <div class="menu-wrap">
          <button class="tb-btn tb-avatar" id="userBtn" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="avatar" id="userInitials"></span>
          </button>
          <div class="menu menu-user" id="userMenu" role="menu" hidden></div>
        </div>
      </div>
    </header>

    <main class="page" id="page"></main>
  </div>

  <nav class="tabbar" aria-label="Navigatsiya">
    <div class="tabbar-inner" id="tabbarInner"></div>
  </nav>
</div>

<div class="toasts" id="toasts"></div>

<dialog class="sheet" id="sheet" aria-label="Oyna">
  <div class="sheet-inner" id="sheetBody"></div>
</dialog>

<!-- Kutubxona saytning o'zida turadi: tashqi CDN ishlamasa ham panel ochiladi -->
<script src="assets/supabase.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
