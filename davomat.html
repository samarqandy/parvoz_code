<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070e20" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parvoz Davomat">

<title>Parvoz Davomat</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<script>
// Temani sahifa chizilishidan oldin qo'llaymiz
(function () {
  var t;
  try { t = localStorage.getItem('parvoz-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- Yuklanish ekrani -->
<div class="auth" id="boot">
  <div style="text-align:center">
    <div style="width:64px;aspect-ratio:447/559;margin:0 auto 14px;background:var(--logo-url) center/contain no-repeat"></div>
    <span class="spin" style="color:var(--gold)"></span>
  </div>
</div>

<!-- Kirish -->
<div class="auth hidden" id="auth">
  <div class="auth-card">
    <div class="logo"></div>
    <h1 id="authTitle">Davomat tizimi</h1>
    <p class="sub" id="authSub">Parvoz O'quv Markazi · ichki tizim</p>
    <form id="authForm">
      <label class="field hidden"><span>Ism-familiya</span>
        <input class="inp" id="authName" autocomplete="name"></label>
      <label class="field"><span>Email</span>
        <input class="inp" id="authEmail" type="email" required autocomplete="username"></label>
      <label class="field"><span>Parol</span>
        <input class="inp" id="authPass" type="password" required minlength="8" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-block" id="authSubmit" type="submit">Kirish</button>
      <div class="err" id="authErr"></div>
    </form>
    <p class="auth-foot"><a href="index.html">← Saytga qaytish</a></p>
  </div>
</div>

<!-- Ilova -->
<div class="app hidden" id="app">

  <aside class="sidebar">
    <div class="side-brand">
      <div class="logo"></div>
      <div><b>Parvoz</b><small>Davomat tizimi</small></div>
    </div>
    <nav class="side-nav" id="sideNav" aria-label="Asosiy menyu"></nav>
    <div class="side-foot">
      <div class="user-card" id="userCard"></div>
      <button class="btn btn-sm btn-ghost btn-block" data-theme-toggle type="button" style="margin-top:6px"></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="logo"></div>
      <h1 id="pageTitle">Davomat</h1>
      <div class="tb-actions">
        <button class="btn btn-icon btn-ghost" data-theme-toggle type="button"></button>
      </div>
    </header>

    <main class="page" id="page"></main>
  </div>

  <nav class="tabbar" aria-label="Navigatsiya">
    <div class="tabbar-inner" id="tabbarInner"></div>
  </nav>
</div>

<div class="toasts" id="toasts"></div>

<dialog class="sheet" id="sheet" aria-label="Oyna">
  <div class="sheet-inner" id="sheetBody"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
if (typeof supabase === 'undefined') {
  document.body.innerHTML = '<div class="auth"><div class="auth-card"><h1>⚠️ Ulanish xatosi</h1>' +
    '<p class="sub">Kutubxona yuklanmadi. Internet aloqasini tekshirib, sahifani yangilang.</p></div></div>';
} else {
  var s = document.createElement('script');
  s.src = 'assets/app.js';
  document.body.appendChild(s);
}
</script>
</body>
</html>
